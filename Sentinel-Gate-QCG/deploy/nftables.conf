#!/usr/sbin/nft -f
# Sentinel Gate QCG — Layer 3 / Layer 4 packet-filter ruleset.
#
# This is the network/transport-layer half of the gateway. It runs in the
# kernel and acts on packets before they ever reach the application, which is
# the only place volumetric L3/L4 floods can actually be dropped cheaply.
# Apply with:  sudo nft -f deploy/nftables.conf
#
# Tunables are conservative starting points; size them to your real traffic.
# This protects a host serving the gateway on TCP/8000 (adjust as needed).

flush ruleset

table inet sentinel {

    # Blocklist sets, kept in sync with the application's reputation store by
    # `python -m sentinel_gate_qcg.kernel_sync`. A banned source is dropped at
    # L3 with an O(1) set lookup instead of being re-judged by the app.
    set blocklist4 {
        type ipv4_addr
        flags interval, timeout
    }
    set blocklist6 {
        type ipv6_addr
        flags interval, timeout
    }

    # Per-source connection-rate meters (L4).
    set syn_meter4 { type ipv4_addr; flags dynamic, timeout; timeout 60s; }
    set syn_meter6 { type ipv6_addr; flags dynamic, timeout; timeout 60s; }

    chain inbound {
        type filter hook input priority filter; policy drop;

        # !!! LOCKOUT WARNING !!!
        # The policy is DROP. If you administer this host over SSH, UNCOMMENT
        # the next line BEFORE loading this file, or you will be locked out.
        # (Recover from the machine's console with: sudo nft flush ruleset)
        # tcp dport 22 ct state new accept

        # --- L3: sanity / anti-spoof ------------------------------------
        # Drop obviously invalid conntrack states and impossible packets.
        ct state invalid drop
        # Drop fragments (a classic L3 amplification/evasion vector).
        ip frag-off & 0x1fff != 0 drop

        # Established/related traffic is cheap to admit.
        ct state established,related accept

        # Loopback always allowed.
        iif "lo" accept

        # --- L3: reputation blocklist -----------------------------------
        ip  saddr @blocklist4 drop
        ip6 saddr @blocklist6 drop

        # --- L4: ICMP rate limit (ping floods) --------------------------
        ip  protocol icmp   icmp   type echo-request limit rate 10/second accept
        ip  protocol icmp   icmp   type echo-request drop
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second accept

        # --- L4: SYN-flood protection -----------------------------------
        # New TCP connections to the service port are rate-limited per source.
        # SYN cookies (enabled in deploy/sysctl.conf) handle the overflow.
        tcp dport 8000 ct state new \
            add @syn_meter4 { ip saddr limit rate 25/second burst 50 packets } accept
        tcp dport 8000 ct state new \
            add @syn_meter6 { ip6 saddr limit rate 25/second burst 50 packets } accept
        # Anything exceeding the per-source new-connection rate is dropped.
        tcp dport 8000 ct state new drop

        # Everything else to this host is rejected by the drop policy.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain outbound {
        type filter hook output priority filter; policy accept;
    }
}
