# Sentinel Gate QCG — kernel network hardening (Layer 3 / Layer 4).
# Apply with:  sudo sysctl -p deploy/sysctl.conf   (or drop into /etc/sysctl.d/)
# These blunt SYN floods, source spoofing, and connection-table exhaustion at
# the kernel, underneath the application gateway.

# --- L4: SYN-flood mitigation ---
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3

# --- L3: anti-spoofing (reverse-path filtering) ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Ignore source-routed and redirect packets (spoofing / MITM vectors).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# --- L3/L4: ICMP and broadcast amplification ---
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- L4: connection-tracking capacity (avoid conntrack exhaustion DoS) ---
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 1200

# --- L4: socket backlog / ephemeral capacity under load ---
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
