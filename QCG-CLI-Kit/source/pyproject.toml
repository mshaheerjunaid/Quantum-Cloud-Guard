[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qcg-kms"
version = "1.5.1"
description = "Quantum Cloud Guard KMS: a self-hosted post-quantum key management and envelope-encryption service (ML-KEM-1024 + AES-256-GCM)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Shaheer Bin Junaid" }]
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "structlog==26.1.0",
    "cryptography==46.0.3",
    "argon2-cffi==25.1.0",
    "kyber-py==1.0.1",
    "dilithium-py==1.4.0",
    "pyotp==2.9.0",
    "psutil==7.2.2",
]

[project.scripts]
qcg = "qcg_kms.cli:main"

[project.optional-dependencies]
# Production-grade post-quantum backend (matches the research paper's liboqs
# 0.15.0). Installed separately because it builds the liboqs C library; the
# pure-Python kyber-py backend above is the portable default and test backend.
liboqs = [
    "liboqs-python",
]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qcg_kms"]
# The React build output is gitignored but must ship inside the wheel.
artifacts = ["src/qcg_kms/static/**"]

[tool.pytest.ini_options]
# Lesson from the gateway: include the project root so `tests` is importable
# under plain `pytest`, not just `python -m pytest`.
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: FastAPI's Depends()/Query() in argument defaults is the framework's
# intended dependency-injection pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["qcg_kms"]
mypy_path = "src"
ignore_missing_imports = true
